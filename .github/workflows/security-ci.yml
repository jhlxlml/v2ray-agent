name: Security CI

on:
  push:
    branches: [clean-secure]
  pull_request:
    branches: [clean-secure]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq unzip
      - name: Run isolated security checks
        run: bash scripts/security-audit.sh
